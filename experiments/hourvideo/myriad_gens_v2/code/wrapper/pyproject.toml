[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gens-hybrid-cap16-wrapper"
version = "1.0.0"
description = "Auditable wrapper for the frozen GenS-Hybrid-cap16 external baseline"
requires-python = ">=3.11,<3.13"
dependencies = [
  "accelerate==1.4.0",
  "av==14.2.0",
  "decord==0.6.0",
  "numpy==2.1.3",
  "Pillow==11.1.0",
  "qwen-vl-utils==0.0.8",
  "safetensors==0.5.3",
  "sentencepiece==0.2.0",
  "torch==2.6.0",
  "torchvision==0.21.0",
  "transformers==4.49.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["gens_baseline*"]
